[project]
name = "miranoah-api"
version = "0.1.0"
description = "MIRANOAH FastAPI backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
  "sqlalchemy>=2.0.40,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "pydantic-settings>=2.10,<3.0",
  "alembic>=1.16,<2.0",
  "redis>=6.2,<7.0",
  "dramatiq[redis]>=1.18,<2.0",
  "slack-sdk>=3.36,<4.0",
  "slack-bolt>=1.23,<2.0",
  "httpx>=0.28,<1.0",
  "python-jose[cryptography]>=3.5,<4.0",
  "passlib[bcrypt]>=1.7,<2.0",
  "openai>=1.100,<2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["../../tests"]
